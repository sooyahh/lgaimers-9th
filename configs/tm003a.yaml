# TM-003A: EXP-004 + one Trackman-derived numeric feature.
# Identical to configs/baseline.yaml except experiment purpose/notes.
# Feature tm_expected_ivb_by_count is fold-injected by the runner; it is not in train.csv.
# Diagnostic tm_expected_ivb_global is never a model input.

project:
  name: lg_aimers_phase2_temporal_baselines
  purpose: tm003a_expected_ivb_by_count_vs_exp004
  data_version: phase2_open_data_raw_copy
  notes: "TM-003A adds exactly tm_expected_ivb_by_count from prior-history Trackman count x pitch-group mean IVB x as-of pitch mix. Row-level cutoff trackman.season < row.season. min_n=1000 sparse fallback to count-agnostic group mean. Validation/metric/seed/CatBoost params match baseline.yaml / EXP-004. No Public LB submit."
  next_action: "Compare TM-003A expanding-fold raw BSS to EXP-004; no Public LB submit; stop after this experiment."

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  sample_submission_path: data/raw/sample_submission.csv
  target_col: control_success
  id_col: row_id
  submission_key_cols: [row_id]
  season_col: season
  time_col: null
  order_cols: []
  entity_id_col: pitcher_id

task:
  problem_type: binary_classification
  metric:
    name: brier_skill_score
    direction: maximize
    clip_at_zero: true
    scale: 100000
  metric_callable: null

cv:
  strategy: season_holdout
  primary:
    train_seasons: [2019, 2020, 2021, 2022, 2023]
    valid_seasons: [2024]
  secondary_folds:
    - train_seasons: [2019, 2020, 2021]
      valid_seasons: [2022]
    - train_seasons: [2019, 2020, 2021, 2022]
      valid_seasons: [2023]
    - train_seasons: [2019, 2020, 2021, 2022, 2023]
      valid_seasons: [2024]
  min_train_seasons: 2
  validation_seasons: 1
  holdout_seasons: 1
  gap_seasons: 0

models:
  enabled:
    - global_mean
    - logistic_regression
    - catboost
    - lightgbm
  missing_dependency: skip
  params:
    global_mean: {}
    logistic_regression:
      C: 1.0
      solver: liblinear
      max_iter: 1000
    catboost:
      iterations: 300
      learning_rate: 0.05
      depth: 6
      loss_function: Logloss
    lightgbm:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 31

features:
  exclude_cols:
    - row_id
    - home_win_expectancy
    - away_win_expectancy
    - li
  categorical_cols:
    - top_bottom
    - game_type
    - base_state
    - pitcher_id
    - batter_id
    - pitcher_hand
    - batter_hand
    - pitcher_team_id
    - batter_team_id
  parse_datetime: false
  add_missing_indicators: true

diagnostics:
  calibration_bins: 10
  min_group_rows: 30

submission:
  models: null

runtime:
  seed: 42

output:
  models_dir: outputs/models
  predictions_dir: outputs/predictions
  submissions_dir: outputs/submissions
  experiments_path: outputs/experiments.csv

# Documentation / freeze metadata only. The runner must not treat this block as a
# tuning interface. Feature math stays in src/trackman_profiles.py.
tm003a:
  experiment_id: TM-003A
  baseline_experiment: EXP-004
  trackman_path: data/raw/trackman_history.csv
  model_feature: tm_expected_ivb_by_count
  diagnostic_feature: tm_expected_ivb_global
  diagnostic_is_model_input: false
  min_n: 1000
  min_n_is_tunable: false
  min_n_note: "Predeclared frozen constant (TM-AUDIT-002 sparse threshold). Not a tuning parameter."
  temporal_history_rule: "trackman.season < row.season"
  pitch_groups: [fastball, breaking, offspeed]
  excluded_pitch_groups: [other]
  count_cell:
    definition: "balls_before-strikes_before"
    legal_balls: [0, 1, 2, 3]
    legal_strikes: [0, 1, 2]
  cell_n_definition: "full cell row count, including IVB-missing rows; not the IVB-observed count"
  sparse_fallback:
    when: "prior-history count x pitch_type_group cell n < min_n"
    then: "same-group count-agnostic mean IVB from the same prior-history window"
  nonfinite_cell_mean_fallback:
    when: "n >= min_n but cell mean is non-finite"
    then: "same-group count-agnostic global fallback"
    note: "Defensive branch only. Not a tunable rule. Observed count is recorded as a diagnostic."
  aggregation: plain_sum
  aggregation_formula: "sum_g asof_mix_g * IVB_hist(count, g)"
  seed: 42
  seed_source: runtime.seed
  validation_source: "configs/tm003a.yaml cv.secondary_folds; reports/validation_policy.md"
  season_weights_source: "scripts/run_regime_shift_experiments.py::SEASON_WEIGHTS"
  season_weights:
    2019: 1.0
    2020: 1.2
    2021: 1.4
    2022: 1.6
    2023: 2.0
  canonical_requires_explicit_flag: true
